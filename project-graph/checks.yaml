apiVersion: typeflux.dev/graph/v1alpha1
entities:
  - id: check.deployed-review-ownership
    kind: check
    description: Unit refusal/ownership and real manifest-validation regressions for the optional Docker controller. These CI tests do not execute the deployed target or certify recovery.
    environment: python-non-live
    ci: [python-3.12]
    tests:
      - {path: packages/python/tests/test_deployed_review_verification.py, name: test_existing_attempt_is_never_overwritten}
      - {path: packages/python/tests/test_deployed_review_verification.py, name: test_cleanup_refuses_another_resource}
      - {path: packages/python/tests/test_deployed_review_verification.py, name: test_ambiguous_create_is_reconciled_but_remains_a_failed_attempt}
      - {path: packages/python/tests/test_deployed_review_verification.py, name: test_prepared_version_projects_pass_real_manifest_validation}
    links:
      - {relation: verifies, target: invariant.deployed-review-ownership}
  - id: check.console-scoped-transport-unit
    kind: check
    description: Unit checks preserve scoped mutation bytes, authorization, standard Request options and AbortSignal; GETs remain bodyless and registry discovery unscoped. Not browser or deployment evidence.
    environment: node-web
    ci: [web]
    tests:
      - {path: clients/console/src/apiTransport.test.ts, name: "preserves a scoped mutation's body, bearer, request options and abort signal"}
      - {path: clients/console/src/apiTransport.test.ts, name: keeps scoped GETs bodyless and registry discovery unscoped}
      - {path: clients/console/src/apiTransport.test.ts, name: keeps a scoped GET bodyless when the Request.body getter is unavailable}
    links:
      - {relation: verifies, target: invariant.browser-scoped-transport}
  - id: check.console-scoped-transport-browser
    kind: check
    description: Real Chromium POST through the HTTP/1 proxy to each actual control-plane edition. The malformed command returns the actual API 422 once, naming user_decision; this negative transport test requires no provider credentials and does not establish Temporal dispatch or workflow progress.
    environment: chromium-real-http-python-cp-and-ts-cp
    ci: [browser-python, browser-typescript]
    tests:
      - {path: clients/console/e2e/transport.spec.ts, name: scoped review POST reaches the real API and retains its validation error}
    links:
      - {relation: verifies, target: invariant.browser-scoped-transport}
  - id: check.review-python
    kind: check
    description: Python HTTP review and binding contract regressions.
    environment: python-non-live
    ci: [python-3.12]
    tests:
      - {path: packages/python/tests/test_controlplane_api.py, name: test_review_permission_denial_never_dispatches_signal}
      - {path: packages/python/tests/test_controlplane_api.py, name: test_malformed_review_never_constructs_operations_or_dispatches_signal}
      - {path: packages/python/tests/test_controlplane_api.py, name: test_review_and_cancel_return_no_content}
      - {path: packages/python/tests/test_controlplane_api.py, name: test_lifecycle_binding_error_maps_to_409}
      - {path: packages/python/tests/test_yaml.py, name: test_lifecycle_signals_verify_binding_before_dispatch}
      - {path: packages/python/tests/test_yaml.py, name: test_review_describe_failure_never_dispatches_signal}
      - {path: packages/python/tests/test_yaml.py, name: test_uncertain_review_is_not_retried_and_status_can_reconcile}
      - {path: packages/python/tests/test_project.py, name: test_project_cli_review_submits_the_decision_with_gate_semantics}
    links:
      - {relation: verifies, target: invariant.execution-binding}
      - {relation: verifies, target: invariant.review-permission}
  - id: check.review-typescript
    kind: check
    description: TypeScript review dispatch, run pinning and backend failure regressions.
    environment: node-non-live
    ci: [typescript]
    tests:
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'submitReview signals typeflux_submit_review with the command'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 're-pins to the described run id when the handle was id-only (TOCTOU guard)'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'a gRPC UNAVAILABLE on describe maps to 503 (top-level .code)'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'an unavailable describe cannot dispatch a review signal'}
      - {path: packages/typescript/temporal-controlplane/test/http-adapter.test.ts, name: 'a malformed review is refused before the unreachable backend can dispatch'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'review refuses workflow type binding without signalling'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'review refuses project binding without signalling'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'review refuses workflow binding without signalling'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'review refuses version binding without signalling'}
      - {path: packages/typescript/temporal-controlplane/test/operations.test.ts, name: 'an uncertain review response is not retried and can be reconciled by status'}
    links:
      - {relation: verifies, target: invariant.execution-binding}
      - {relation: verifies, target: invariant.review-failure}
  - id: check.review-browser
    kind: check
    description: Browser review interaction against both read-API editions with self-contained bundle fixtures, unexpected background API failure assertions and controlled operation responses; not live Temporal evidence.
    environment: chromium-python-cp-and-ts-cp
    ci: [browser-python, browser-typescript]
    tests:
      - {path: clients/console/e2e/smoke.spec.ts, name: fixture bundles resolve across projects and environments without credentials}
      - {path: clients/console/e2e/review.spec.ts, name: review journey submits to the selected execution and observes progress}
      - {path: clients/console/e2e/review.spec.ts, name: review journey respects permission denial without submitting}
      - {path: clients/console/e2e/review.spec.ts, name: review journey reports binding mismatch without offering a decision}
      - {path: clients/console/e2e/review.spec.ts, name: review journey surfaces an invalid decision without claiming completion}
      - {path: clients/console/e2e/review.spec.ts, name: review journey recovers after backend failure without automatic resubmission}
    links:
      - {relation: verifies, target: journey.review-workflow}
      - {relation: verifies, target: invariant.review-progress}
      - {relation: verifies, target: invariant.review-failure}
  - id: check.review-temporal
    kind: check
    description: Real local Temporal with fake providers; both control planes acknowledge a review and observe workflow completion. Both documented SDK demos observe a gate before signalling, target a pinned run, then verify its selected route, started steps, completed lifecycle and validated result. Runs in isolated CI and local development without external provider credentials.
    environment: local-temporal
    ci: [temporal]
    tests:
      - {path: packages/python/tests/test_live_ts_binding.py, name: test_python_cp_operates_a_ts_execution_live}
      - {path: packages/typescript/temporal-controlplane/test/live-operate.test.ts, name: 'starts, reaches the review gate, approves to completion'}
      - {path: packages/python/tests/test_live_review_adoption.py, name: test_documented_review_adoption_observes_bound_gate_route_and_result}
      - {path: packages/typescript/temporal-yaml/test/live-review-adoption.test.ts, name: 'observes the bound gate, selected route and result through the documented SDK caller'}
      - {path: packages/typescript/temporal-yaml/test/live-review-adoption.test.ts, name: 'preserves a rejected start and submits no review decision'}
    links:
      - {relation: verifies, target: invariant.review-progress}
      - {relation: verifies, target: invariant.execution-binding}
  - id: check.gateway-python
    kind: check
    description: Mocked Python gateway configuration, activity validation, policy/cache identity, usage, errors, cancellation and real SDK serialization. Live smoke is separate and opt-in.
    environment: python-non-live
    ci: [python-3.12]
    tests:
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_structured_output_and_usage}
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_activity_policy_cache_and_validation}
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_failures_are_classified_and_redacted}
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_transient_retry_uses_existing_policy}
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_yaml_example_executes_validated_activity}
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_rejects_unsupported_options_before_transport}
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_async_timeout_and_cancellation}
      - {path: packages/python/tests/test_vercel_ai_gateway_provider.py, name: test_gateway_real_sdk_wire_and_validation}
      - {path: packages/python/tests/test_observability.py, name: test_generation_response_identity_preserves_existing_metadata}
    links:
      - {relation: verifies, target: invariant.gateway-configuration}
      - {relation: verifies, target: invariant.gateway-output}
      - {relation: verifies, target: invariant.gateway-identity}
      - {relation: verifies, target: invariant.gateway-failure}
  - id: check.gateway-typescript
    kind: check
    description: Mocked TypeScript gateway activity, schema validation, model-aware policy/cache identity, token usage, retries and cancellation.
    environment: node-non-live
    ci: [typescript]
    tests:
      - {path: packages/typescript/temporal/test/vercel-ai-gateway-provider.test.ts, name: executes a validated activity and reports separate gateway model and upstream identity}
      - {path: packages/typescript/temporal/test/vercel-ai-gateway-provider.test.ts, name: partitions cache and enforces policy using the constructor model before a cache hit}
      - {path: packages/typescript/temporal/test/vercel-ai-gateway-provider.test.ts, name: repairs invalid output through the existing activity validation loop}
      - {path: packages/typescript/temporal/test/vercel-ai-gateway-provider.test.ts, name: retries transient failures through the executor and propagates cancellation}
      - {path: packages/typescript/temporal/test/vercel-ai-gateway-provider.test.ts, name: requires an explicit namespaced model and text input}
    links:
      - {relation: verifies, target: invariant.gateway-output}
      - {relation: verifies, target: invariant.gateway-identity}
      - {relation: verifies, target: invariant.gateway-failure}
  - id: check.gateway-yaml
    kind: check
    description: TypeScript YAML gateway selection, lazy SDK configuration and example activity invocation without external credentials.
    environment: node-non-live
    ci: [typescript]
    tests:
      - {path: packages/typescript/temporal-yaml/test/vercel-ai-gateway.test.ts, name: configures the gateway SDK and executes the example activity}
      - {path: packages/typescript/temporal-yaml/test/vercel-ai-gateway.test.ts, name: requires a gateway key without falling back to OpenAI credentials}
      - {path: packages/typescript/temporal-yaml/test/vercel-ai-gateway.test.ts, name: rejects missing models and unsupported gateway options during load}
    links:
      - {relation: verifies, target: invariant.gateway-configuration}
      - {relation: verifies, target: invariant.gateway-output}

  - id: check.browser-data-readiness
    kind: check
    description: Completed successful fixture data, including deployments and bundles for drift and page annotations for insights, precedes overview/project-switch/insights/drift/governance/security content assertions under controlled six-second minimum response times; missing, failed and permanently pending data remain bounded failures.
    environment: chromium-python-cp-and-ts-cp
    ci: [browser-python, browser-typescript]
    tests:
      - {path: clients/console/e2e/smoke.spec.ts, name: overview renders bundles and the project switch rescopes requests}
      - {path: clients/console/e2e/smoke.spec.ts, name: 'insight acknowledgements: the annotations read is served per lane and stale acks render (#733)'}
      - {path: clients/console/e2e/smoke.spec.ts, name: 'the drift page renders the N-way environment matrix with diff links (#611)'}
      - {path: clients/console/e2e/smoke.spec.ts, name: 'the drift page aggregates plan, environment, and prompt drift (#583)'}
      - {path: clients/console/e2e/smoke.spec.ts, name: 'the governance page shows coverage, gaps, and structured policies (#587)'}
      - {path: clients/console/e2e/smoke.spec.ts, name: 'the governance persona view leads with coverage, policy hashes, and the enforcement feed (#721/#723)'}
      - {path: clients/console/e2e/smoke.spec.ts, name: 'the security-posture persona view shows runtime controls and policy-enforced controls (#721)'}
      - {path: clients/console/e2e/readiness.spec.ts, name: data readiness requires the named successful GET and preserves missing-content failures}
      - {path: clients/console/e2e/readiness.spec.ts, name: data readiness rejects unexpected API errors even after a successful retry}
      - {path: clients/console/e2e/readiness.spec.ts, name: allowed unavailable responses settle but cannot satisfy successful data readiness}
      - {path: clients/console/e2e/readiness.spec.ts, name: permanently pending API reads fail within the readiness budget with their URL}
      - {path: clients/console/e2e/readiness.spec.ts, name: drift readiness rejects bundle-only data and an allowed deployment outage}
    links:
      - {relation: verifies, target: invariant.browser-data-readiness}
