apiVersion: typeflux.dev/graph/v1alpha1
entities:
  - id: journey.execute-local-yaml-cli-python
    kind: journey
    description: A Python user executes a local YAML workflow or project without a worker or orchestration service.
    steps:
      - id: admit
        action: Select a YAML file or project workflow and environment, then supply input JSON.
        outcome: Shared resolution composes profiles and policies across children; unsupported capabilities and expected-policy mismatches fail before service construction, including in skipped branches.
        capabilities: [capability.local-yaml-cli]
        checks: [check.local-yaml-cli-python]
        failures: [policy bypass in a child, environment profile precedence drift, Temporal class construction, provider constructed before refusal]
      - id: execute
        action: Execute in the foreground and read stdout, stderr and the exit status.
        outcome: The existing local SDK returns validated JSON; execution failures carry SDK workflow/step context on stderr, input failures are distinct, and observations shut down after success or failure.
        capabilities: [capability.local-yaml-cli]
        checks: [check.local-yaml-cli-python, check.local-yaml-errors-python]
        failures: [non-JSON stdout, wrong input failure category, failed preparation leaks observation resources, hidden orchestration connection]
      - id: interrupt
        action: Send SIGINT or SIGTERM while the provider is active.
        outcome: Cooperative cancellation drains the active call before observation shutdown and exits with the signal category.
        capabilities: [capability.local-yaml-cli]
        checks: [check.local-yaml-cli-python]
        failures: [shutdown before cancellation settles, result printed after interruption, invented durable resume]
      - id: lose-process
        action: Complete one step, SIGKILL the CLI during the next provider call, then invoke a new command using the same YAML and input.
        outcome: The killed process returns no result and performs no graceful shutdown; its first effect remains. The new process starts at step one, repeats that effect and completes downstream steps.
        capabilities: [capability.local-yaml-cli]
        checks: [check.local-yaml-cli-python]
        failures: [invented crash cleanup guarantee, completed effect reversed, fresh command resumes midway, killed command prints a successful result]
