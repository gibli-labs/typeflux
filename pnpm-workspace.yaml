# Polyglot monorepo — pnpm workspace for the TypeScript SDK packages.
# The Python SDK lives at packages/python (its own uv project).
# The existing control-plane clients under clients/* use npm and are not part
# of this pnpm workspace.
packages:
  - "packages/typescript/*"

# Force protobufjs off the version pulled transitively by @temporalio/proto
# (7.5.8) that is vulnerable to GHSA-wcpc-wj8m-hjx6 (DoS via unbounded Any
# expansion in JSON conversion; patched in 7.6.1). Stays on 7.x for @temporalio
# compatibility.
overrides:
  protobufjs@<7.6.1: ">=7.6.1 <8"
  # Redocly pins js-yaml below the GHSA-2883-xcg3-v3hh fix.
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2 <5"

# Reviewed native compiler installers; other packages ship usable artifacts.
# Keep strictDepBuilds enabled so new install hooks need an explicit decision.
allowBuilds:
  '@swc/core': true
  esbuild: true
  protobufjs: false
  '@google/genai': false
