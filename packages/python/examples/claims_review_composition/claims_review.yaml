# claims_review — the #55 composition showcase (YAML+code authoring mode).
#
# One workflow exercises the full composition surface:
#   * a `parallel:` block with two heterogeneous, `when`-gated branches + `collect`
#     (an if/else pair: exactly one of fast_track / full_review runs per priority);
#   * `map.workflow` fan-out (the full_review branch fans the `claim_triage`
#     sub-workflow over every claim);
#   * a `workflow:` sub-workflow step (`escalation_review`);
#   * multiple review gates (`lifecycle.gates`): two gates on distinct steps, each with
#     routed decisions, and the first with a `route` timeout.
#
# Its own activities are code-injected (`activities.modules`); the referenced
# sub-workflows are pure-YAML — both authoring modes composed in one project.
project: examples.claims_review_composition
name: claims_review
task_queue: ${TEMPORAL_TASK_QUEUE:-claims-review-composition-typeflux}

runtime:
  temporal:
    address: ${TEMPORAL_ADDRESS:-localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:-default}
    tls: ${TEMPORAL_TLS:-false}
    api_key:
      value_from:
        env: TEMPORAL_API_KEY
        required: false

  registry:
    type: inline
    prompts:
      # Registry composition (#748): the composed worker serves ONE registry, built as the
      # MERGE of this parent's registry and every sub-workflow's own (claim_triage.yaml's
      # `triage-claim`, escalation_review.yaml's `escalate-review`). Only THIS workflow's own
      # prompts live here — the children's are pulled in automatically, no duplication.
      acknowledge-intake: |
        Low-priority intake with {{claims}} — acknowledge receipt.
      consolidate-intake: |
        Consolidate the intake fan-out into a review summary.
        fast_track: {{fast_track}}
        full_review: {{full_review}}
      finalize-review: |
        Finalize the review decision from summary {{summary}} (escalate={{escalate}}).

  provider:
    type: openai
    model: ${TYPEFLUX_OPENAI_MODEL:-gpt-4o-mini}
    structured_mode: json_schema
    api_key:
      value_from:
        env: OPENAI_API_KEY
        required: false

  observability:
    type: langfuse
    execution_manifest: true
    redaction:
      enabled: true
      preserve_typeflux_metadata: true

activities:
  modules:
    - activities

workflow:
  name: ClaimsReviewWorkflow
  input: schemas:ClaimBatch
  output: schemas:ReviewPacket
  lifecycle:
    enabled: true
    progress: true
    cancellation: true
    history:
      status_event_limit: 50
    gates:
      # Gate 1: after the intake is consolidated, a reviewer either escalates (run the
      # escalation sub-workflow) or expedites (skip straight to finalize). If no
      # decision arrives within the window, the timer routes to `finalize` (expedite).
      - id: intake_gate
        after_step: consolidate
        invalid_user_decision: fail
        user_decisions:
          escalate:
            route: escalation
          expedite:
            route: finalize
        timeout:
          seconds: 3600
          on_timeout: route
          route: finalize
      # Gate 2: only reached when gate 1 escalated. A second reviewer approves or
      # rejects; both routes converge on `finalize` (the terminal step).
      - id: compliance_gate
        after_step: escalation
        invalid_user_decision: fail
        user_decisions:
          approve:
            route: finalize
          reject:
            route: finalize
  steps:
    - id: screen
      parallel:
        branches:
          - id: fast_track
            when: { path: input.priority, eq: low }
            steps:
              - id: fast_ack
                activity: acknowledge
          - id: full_review
            when: { path: input.priority, neq: low }
            steps:
              - id: triage_all
                map:
                  workflow: claim_triage
                  over: input.claims
                  concurrency: 3
                  collect:
                    output: schemas:TriageBatch
                    field: triaged
        collect:
          output: schemas:IntakeFanout
    - id: consolidate
      activity: consolidate
    - id: escalation
      workflow: escalation_review
    - id: finalize
      activity: finalize
