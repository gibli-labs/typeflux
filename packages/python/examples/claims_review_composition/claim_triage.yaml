# claim_triage — a PURE-YAML sub-workflow (#55): activities are declared inline
# (`activities.definitions` + an inline prompt registry), so the engine generates the
# AI activity from the spec with no injected Python code. It is referenced by the
# parent's `map.workflow` fan-out (one child execution per claim) and is also a valid
# standalone workflow in its own right.
project: examples.claims_review_composition
name: claim_triage
task_queue: ${TEMPORAL_TASK_QUEUE:-claims-review-composition-typeflux}

runtime:
  temporal:
    address: ${TEMPORAL_ADDRESS:-localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:-default}
    tls: ${TEMPORAL_TLS:-false}
    api_key:
      value_from:
        env: TEMPORAL_API_KEY
        required: false

  registry:
    type: inline
    prompts:
      triage-claim: |
        Triage claim {{claim_id}} and return a risk band (low, medium, high).
        Claim text: {{text}}

  provider:
    type: openai
    model: ${TYPEFLUX_OPENAI_MODEL:-gpt-4o-mini}
    structured_mode: json_schema
    api_key:
      value_from:
        env: OPENAI_API_KEY
        required: false

  observability:
    type: langfuse
    execution_manifest: true
    redaction:
      enabled: true
      preserve_typeflux_metadata: true

activities:
  definitions:
    - name: triage_claim
      input: schemas:Claim
      output: schemas:Triage
      prompt: triage-claim

workflow:
  name: ClaimTriageWorkflow
  input: schemas:Claim
  output: schemas:Triage
  steps:
    - id: triage
      activity: triage_claim
