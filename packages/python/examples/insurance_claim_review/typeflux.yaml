project: examples.insurance_claim_review
name: insurance_claim_review
task_queue: ${TEMPORAL_TASK_QUEUE:-insurance-claim-review-typeflux}

runtime:
  temporal:
    address: ${TEMPORAL_ADDRESS:-localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:-default}
    tls: ${TEMPORAL_TLS:-false}
    api_key:
      value_from:
        env: TEMPORAL_API_KEY
        required: false

  registry:
    type: langfuse
    label: ${LANGFUSE_PROMPT_LABEL:-production}

  provider:
    type: openai
    model: ${TYPEFLUX_OPENAI_MODEL:-gpt-4o-mini}
    structured_mode: json_schema

  provider_limits:
    default:
      max_concurrent: 4
    providers:
      openai:
        models:
          gpt-4o-mini:
            max_concurrent: 1
            min_interval_seconds: 0.25

  observability:
    type: langfuse
    execution_manifest: true
    redaction:
      enabled: true
      emails: true
      phones: true
      ssn: true
      credit_cards: true
      preserve_typeflux_metadata: true
      exclude_paths: []

activities:
  modules:
    - activities

workflow:
  name: InsuranceClaimReviewWorkflow
  input: schemas:ClaimInput
  output: schemas:ClaimReviewPacket
  steps:
    - id: review_evidence
      map:
        activity: review_evidence_item
        over: input.evidence
        concurrency: 3
        collect:
          output: schemas:EvidenceReviewBatch
          field: reviews
    - id: consolidate
      activity: consolidate_claim_review
