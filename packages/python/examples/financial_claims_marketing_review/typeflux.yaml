project: examples.financial_claims_marketing_review
name: financial_claims_marketing_review
task_queue: ${TEMPORAL_TASK_QUEUE:-financial-claims-marketing-review-typeflux}

runtime:
  temporal:
    address: ${TEMPORAL_ADDRESS:-localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:-default}
    tls: ${TEMPORAL_TLS:-false}
    api_key:
      value_from:
        env: TEMPORAL_API_KEY
        required: false

  registry:
    type: langfuse
    label: ${LANGFUSE_PROMPT_LABEL:-production}

  provider:
    type: openai
    model: ${TYPEFLUX_OPENAI_MODEL:-gpt-4o-mini}
    structured_mode: json_schema

  provider_limits:
    default:
      max_concurrent: 4
    providers:
      openai:
        models:
          gpt-4o-mini:
            max_concurrent: 1
            min_interval_seconds: 0.25

  observability:
    type: langfuse
    execution_manifest: true
    redaction:
      enabled: true
      emails: true
      phones: true
      ssn: true
      credit_cards: true
      preserve_typeflux_metadata: true
      exclude_paths: []

activities:
  definitions:
    - name: review_marketing_claim
      input: schemas:MarketingClaim
      output: schemas:ClaimComplianceReview
      prompt:
        name: financial-claims-review-claim
        type: chat
      validation_retries: 2
    - name: consolidate_marketing_review
      input: schemas:ClaimComplianceReviewBatch
      output: schemas:MarketingReviewPacket
      prompt:
        name: financial-claims-consolidate
        type: chat

workflow:
  name: FinancialClaimsMarketingReviewWorkflow
  input: schemas:MarketingSubmission
  output: schemas:MarketingReviewPacket
  steps:
    - id: review_claims
      map:
        activity: review_marketing_claim
        over: input.claims
        concurrency: 3
        collect:
          output: schemas:ClaimComplianceReviewBatch
          field: reviews
    - id: consolidate
      activity: consolidate_marketing_review
