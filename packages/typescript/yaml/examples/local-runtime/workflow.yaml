project: local_example
name: echo
runtime:
  # Local is the default; choose engine: temporal in the durable environment.
  provider:
    type: fake
  registry:
    type: inline
    prompts: {echo: 'Echo {{text}}'}
activities:
  definitions:
    - {name: echo, input: 'models:Value', output: 'models:Value', prompt: echo}
workflow:
  name: Echo
  input: models:Value
  output: models:Value
  steps: [{id: echo, activity: echo}]
