version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
    groups:
      # Keep the shared uv lockfile in one routine update PR instead of
      # opening separate PRs for every runtime and development dependency.
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # Update the pnpm workspace from its root so package manifests and the
  # shared pnpm-lock.yaml are updated together. Clients use npm separately.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep the type surface aligned with the SDK's supported Node 24 runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      pnpm-workspace:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/mcp"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      mcp-deps:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/typescript"
    schedule:
      interval: "weekly"
    groups:
      client-deps:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/console"
    schedule:
      interval: "weekly"
    groups:
      console-deps:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/tools/openapi-generator"
    schedule:
      interval: "weekly"
    ignore:
      # This is the generator's compiler API dependency, not the product compiler.
      # Remove when openapi-typescript supports the native compiler API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      generator:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories: ["/deploy/yaml-worker", "/deploy/ts-yaml-worker"]
    schedule:
      interval: "weekly"
    groups:
      reference-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
