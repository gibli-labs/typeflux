version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dev-tooling:
        patterns:
          - "build"
          - "mypy"
          - "pytest"
          - "pytest-asyncio"
          - "ruff"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # The pnpm workspace has no root package.json — target the workspace
  # packages directly (Dependabot resolves the shared root lockfile).
  - package-ecosystem: "npm"
    directories:
      - "/packages/typescript/*"
    schedule:
      interval: "weekly"
    groups:
      pnpm-workspace:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/mcp"
    schedule:
      interval: "weekly"
    groups:
      mcp-deps:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/typescript"
    schedule:
      interval: "weekly"
    groups:
      client-deps:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/console"
    schedule:
      interval: "weekly"
    groups:
      console-deps:
        update-types:
          - "minor"
          - "patch"
