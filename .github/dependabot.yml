version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
    groups:
      python-dev-tooling:
        patterns:
          - "build"
          - "mypy"
          - "pytest"
          - "pytest-asyncio"
          - "ruff"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # Update the pnpm workspace from its root so package manifests and the
  # shared pnpm-lock.yaml are updated together. Clients use npm separately.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep the type surface aligned with the SDK's supported Node 22 runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      pnpm-workspace:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/mcp"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      mcp-deps:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/typescript"
    schedule:
      interval: "weekly"
    groups:
      client-deps:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/console"
    schedule:
      interval: "weekly"
    groups:
      console-deps:
        update-types:
          - "minor"
          - "patch"
