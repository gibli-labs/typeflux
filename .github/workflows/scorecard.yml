# OpenSSF Scorecard: weekly supply-chain posture analysis published to the
# repository's Security tab (SARIF). Public-repo badge activates once the
# public repository exists.
name: Scorecard

on:
  schedule:
    - cron: "37 7 * * 2"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Code-scanning SARIF upload needs GH code scanning, unavailable on this
    # private repo by default — same enablement-variable guard as CodeQL.
    if: ${{ !github.event.repository.private || vars.ENABLE_SCORECARD == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # public repo: results feed the OpenSSF Scorecard API/badge

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
