name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: python
          python: ${{ matrix.python }}
      - name: Verify tests
        env:
          CHECK: python
          CHECK_ID: python-${{ matrix.python }}
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-python-${{ matrix.python }}-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: python
      - name: Verify quality
        env:
          CHECK: quality
          CHECK_ID: quality
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.0 detect --source . --redact
      - name: Minimal wheel installation
        run: |
          uv venv "$RUNNER_TEMP/minimal"
          uv pip install --python "$RUNNER_TEMP/minimal/bin/python" packages/python/dist/*.whl
          "$RUNNER_TEMP/minimal/bin/python" -I -c 'import typeflux'
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-quality-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error

  web:
    name: Web (client + console)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: web
      - name: Verify web
        env:
          CHECK: web
          CHECK_ID: web
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-web-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: python-cp
            check: browser-python
          - server: ts-cp
            check: browser-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the mounted checkout in the browser container
        # The host checkout owner differs from the container's runtime user.
        # Scope the exception to this workspace, never every repository.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-development
        with:
          scope: browser
      - name: Verify browser
        env:
          CHECK: ${{ matrix.check }}
          CHECK_ID: ${{ matrix.check }}
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-${{ matrix.check }}-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: traces-${{ matrix.check }}
          path: clients/console/test-results/
          if-no-files-found: ignore

  conformance:
    name: Control-plane conformance (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: python-cp
            scope: python
            check: conformance-python
          - server: ts-cp
            scope: typescript
            check: conformance-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: ${{ matrix.scope }}
      - name: Verify conformance
        env:
          CHECK: ${{ matrix.check }}
          CHECK_ID: ${{ matrix.check }}
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-${{ matrix.check }}-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: typescript
      - name: Verify sdk-typescript
        env:
          CHECK: typescript
          CHECK_ID: typescript
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-typescript-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error

  mcp:
    name: MCP server (typeflux-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: mcp
      - name: Verify mcp
        env:
          CHECK: mcp
          CHECK_ID: mcp
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-mcp-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error

  temporal:
    name: Local Temporal journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: temporal
      - name: Verify temporal
        env:
          CHECK: temporal
          CHECK_ID: temporal
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-temporal-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error

  project-graph:
    name: Project graph (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-development
        with:
          scope: graph
      - name: Verify project-graph
        env:
          CHECK: graph
          CHECK_ID: graph
        run: uv run --project packages/python python -m tools.development run "$CHECK" --check-id "$CHECK_ID"
      - name: Explain impact and render human views
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          uv run --project packages/python python -m tools.project_graph --output .project-graph/impact.json report --base "$BASE_SHA" --head "$GITHUB_SHA"
          uv run --project packages/python python -m tools.project_graph --output .project-graph/explorer.html explore --base "$BASE_SHA" --revision "$GITHUB_SHA"
      - name: Upload graph views
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: project-graph
          path: |
            .project-graph/impact.json
            .project-graph/explorer.html
          include-hidden-files: true
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-graph-${{ github.run_attempt }}
          path: .project-graph/evidence/
          include-hidden-files: true
          if-no-files-found: error
