# The PARENT of the sub-workflow conformance fixture (#55 slice 3): fans the sibling
# `child_assessment` workflow over the claims as a Temporal child per item (`map.workflow`)
# and collects the child outputs. Byte-identical to the Python binding's copy — the topology
# projection (a `workflow` node carrying the child manifest id) must match across editions.
project: conformance_project
name: conformance_subworkflow
task_queue: conformance-demo-queue
runtime:
  temporal:
    address: localhost:7233
  registry:
    type: inline
    prompts:
      assess: assess {{value}}
  provider:
    type: anthropic
    model: claude-sonnet-4-6
    api_key:
      value_from:
        env: TYPEFLUX_CONFORMANCE_ANTHROPIC_API_KEY
        required: false
  observability:
    type: none
activities:
  definitions: []
workflow:
  name: ConformanceSubworkflow
  input: schemas:ClaimInput
  output: schemas:AssessmentBatch
  steps:
    - id: assess_all
      map:
        workflow: child_assessment
        over: input.claims
        concurrency: 2
        collect:
          output: schemas:AssessmentBatch
          field: reviews
